name: Validate marketplace

on:
  push:
    branches:
      - dev
      - main
      - automation/**
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate manifests and hard cutover
        shell: pwsh
        run: |
          Get-Content .agents/plugins/marketplace.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content .claude-plugin/marketplace.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content plugins/termbrio-team/plugin.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content plugins/termbrio-team/.codex-plugin/plugin.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content plugins/termbrio-team/.claude-plugin/plugin.json -Raw | ConvertFrom-Json | Out-Null
          & scripts/validate-termbrio-marketplace.ps1

      - name: Validate plugin release contract
        shell: pwsh
        run: |
          & scripts/release-changelog-contract-tests.ps1
          & scripts/plugin-release-contract-tests.ps1
          & scripts/plugin-release-workflow-tests.ps1
          & scripts/plugin-release-workflow-policy-tests.ps1
