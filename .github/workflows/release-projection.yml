name: Plugin release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Plugin version to validate without publishing
        required: true
        default: "0.4.4"
        type: string
      channel:
        description: Catalog channel to validate
        required: true
        default: pilot
        type: choice
        options:
          - pilot
          - preview
          - stable
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish plugin release
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out marketplace source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: tbmp

      - name: Check out release contract
        uses: actions/checkout@v7
        with:
          repository: termbrio/releases
          ref: main
          path: releases

      - name: Resolve release intent
        id: release
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push' -and
              '${{ github.ref_type }}' -eq 'tag') {
            $sourceTag = '${{ github.ref_name }}'
            if (-not $sourceTag.StartsWith('v')) {
              throw "Plugin source tag must start with v: $sourceTag"
            }
            $version = $sourceTag.Substring(1)
            $publish = 'true'
            $channel = 'pilot'
          }
          else {
            $version = '${{ inputs.release_version }}'
            $sourceTag = "v$version"
            $publish = 'false'
            $channel = '${{ inputs.channel }}'
          }

          if ($version -notmatch
              '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$') {
            throw "Unsupported plugin version: $version"
          }

          $releaseUrl =
            "https://github.com/termbrio/tbmp/releases/tag/$sourceTag"

          "version=$version" >> $env:GITHUB_OUTPUT
          "source_tag=$sourceTag" >> $env:GITHUB_OUTPUT
          "release_url=$releaseUrl" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT

      - name: Verify publication source
        if: ${{ steps.release.outputs.publish == 'true' }}
        shell: pwsh
        working-directory: tbmp
        run: |
          $expectedTag = "v${{ steps.release.outputs.version }}"
          if ('${{ steps.release.outputs.source_tag }}' -ne $expectedTag) {
            throw "Source tag must be $expectedTag."
          }

          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Plugin tags must identify a commit integrated into main.'
          }

      - name: Validate marketplace
        shell: pwsh
        run: |
          & ./tbmp/scripts/validate-termbrio-marketplace.ps1

      - name: Produce plugin release event
        shell: pwsh
        run: |
          $pluginRevision = git -C ./tbmp rev-parse HEAD
          $arguments = @{
            CodexManifestPath = './tbmp/plugins/termbrio-team/.codex-plugin/plugin.json'
            ClaudeManifestPath = './tbmp/plugins/termbrio-team/.claude-plugin/plugin.json'
            ReleaseVersion = '${{ steps.release.outputs.version }}'
            ReleaseTag = '${{ steps.release.outputs.source_tag }}'
            SourceRevision = $pluginRevision
            OutputPath = './out/events/plugins.json'
            Channel = '${{ steps.release.outputs.channel }}'
          }
          if ('${{ steps.release.outputs.publish }}' -eq 'true') {
            $arguments.ReleaseUrl =
              '${{ steps.release.outputs.release_url }}'
          }

          & ./tbmp/scripts/export-plugin-release-event.ps1 @arguments

      - name: Validate plugin event against receiver contract
        run: >-
          node ./releases/scripts/project-release-event.mjs
          --payload ./out/events/plugins.json
          --catalog ./releases/catalog/latest.json
          --output ./out/projected/catalog/latest.json

      - name: Upload validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: plugin-release-${{ steps.release.outputs.version }}-${{ github.run_id }}
          path: |
            out/events/plugins.json
            out/projected/catalog/latest.json
          if-no-files-found: error
          retention-days: 3

      - name: Publish marketplace release record
        if: ${{ steps.release.outputs.publish == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sourceTag = '${{ steps.release.outputs.source_tag }}'
          $existing = gh release view `
            $sourceTag `
            --repo '${{ github.repository }}' `
            --json tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            $arguments = @(
              'release', 'create', $sourceTag,
              '--repo', '${{ github.repository }}',
              '--verify-tag',
              '--title', "Termbrio Team plugin ${{ steps.release.outputs.version }}",
              '--generate-notes'
            )
            if ('${{ steps.release.outputs.channel }}' -ne 'stable') {
              $arguments += '--prerelease'
            }
            & gh @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Plugin release publication failed with code $LASTEXITCODE."
            }
          }

      - name: Create release-ledger App token
        if: ${{ steps.release.outputs.publish == 'true' }}
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TERMBRIO_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TERMBRIO_RELEASE_APP_PRIVATE_KEY }}
          owner: termbrio
          repositories: releases

      - name: Dispatch published plugin event
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: actions/github-script@v9
        env:
          RELEASE_EVENT_PATH: ./out/events/plugins.json
        with:
          github-token: ${{ steps.release-app-token.outputs.token }}
          script: |
            const fs = require("node:fs");
            const clientPayload = JSON.parse(
              fs.readFileSync(process.env.RELEASE_EVENT_PATH, "utf8"));

            await github.request(
              "POST /repos/{owner}/{repo}/dispatches",
              {
                owner: "termbrio",
                repo: "releases",
                event_type: "termbrio-release",
                client_payload: clientPayload
              });

      - name: Summarize release
        shell: pwsh
        run: |
          @"
          ## Plugin release

          - Plugin release: ${{ steps.release.outputs.version }}
          - Source tag: ${{ steps.release.outputs.source_tag }}
          - Channel: ${{ steps.release.outputs.channel }}
          - Marketplace contents: served directly from termbrio/tbmp
          - GitHub Release record published: ${{ steps.release.outputs.publish }}
          - Catalog dispatch sent: ${{ steps.release.outputs.publish }}
          - Binary assets: not applicable
          "@ >> $env:GITHUB_STEP_SUMMARY
