name: Plugin release event pilot

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: TBMP release version to project
        required: true
        default: "0.4.2"
        type: string
      dispatch:
        description: Send the validated event to termbrio/releases
        required: false
        default: false
        type: boolean
  push:
    branches:
      - automation/source-release-event-pilot

permissions:
  contents: read

concurrency:
  group: plugin-release-event-pilot
  cancel-in-progress: true

env:
  PLUGIN_RELEASE_VERSION: ${{ inputs.release_version || '0.4.2' }}

jobs:
  project:
    name: Validate cross-repo plugin event
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out marketplace source
        uses: actions/checkout@v7
        with:
          path: tbmp

      - name: Check out release contract
        uses: actions/checkout@v7
        with:
          repository: termbrio/releases
          ref: dev
          path: releases

      - name: Validate marketplace
        shell: pwsh
        run: |
          & ./tbmp/scripts/validate-termbrio-marketplace.ps1

      - name: Produce plugin release event
        shell: pwsh
        run: |
          $pluginRevision = git -C ./tbmp rev-parse HEAD
          & ./tbmp/scripts/export-plugin-release-event.ps1 `
            -CodexManifestPath `
              ./tbmp/plugins/termbrio-team/.codex-plugin/plugin.json `
            -ClaudeManifestPath `
              ./tbmp/plugins/termbrio-team/.claude-plugin/plugin.json `
            -ReleaseVersion $env:PLUGIN_RELEASE_VERSION `
            -SourceRevision $pluginRevision `
            -OutputPath ./out/events/plugins.json `
            -Channel pilot

      - name: Validate plugin event against receiver contract
        shell: pwsh
        run: |
          node ./releases/scripts/project-release-event.mjs `
            --payload ./out/events/plugins.json `
            --catalog ./releases/catalog/latest.json `
            --output ./out/projected/catalog/latest.json

      - name: Create release-ledger App token
        if: ${{ inputs.dispatch }}
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TERMBRIO_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TERMBRIO_RELEASE_APP_PRIVATE_KEY }}
          owner: termbrio
          repositories: releases

      - name: Dispatch validated plugin event
        if: ${{ inputs.dispatch }}
        uses: actions/github-script@v9
        env:
          RELEASE_EVENT_PATH: ./out/events/plugins.json
        with:
          github-token: ${{ steps.release-app-token.outputs.token }}
          script: |
            const fs = require("node:fs");
            const clientPayload = JSON.parse(
              fs.readFileSync(process.env.RELEASE_EVENT_PATH, "utf8"));

            await github.request(
              "POST /repos/{owner}/{repo}/dispatches",
              {
                owner: "termbrio",
                repo: "releases",
                event_type: "termbrio-release-pilot",
                client_payload: clientPayload
              });

      - name: Upload pilot evidence
        uses: actions/upload-artifact@v7
        with:
          name: plugin-release-event-pilot-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 3

      - name: Summarize pilot
        shell: pwsh
        run: |
          @"
          ## Plugin release event pilot

          - Cross-repo plugin event: validated
          - Repository dispatch: ${{ inputs.dispatch && 'sent with GitHub App token' || 'not requested' }}
          - External mutations: none
          - GitHub Release creation: disabled
          - Website deployment: disabled
          "@ >> $env:GITHUB_STEP_SUMMARY
